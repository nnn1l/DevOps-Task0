name: Deploy Application to Cloud VM

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select runner type'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts || true

      - name: Copy docker-compose-prod.yaml to VM
        run: |
          # Додано -o StrictHostKeyChecking=no та ConnectTimeout
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p ~/app"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 docker-compose-prod.yaml ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/app/docker-compose-prod.yaml

      - name: Deploy to Cloud VM via SSH
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO || 'frontend' }}
          ECR_BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO || 'backend' }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region $AWS_REGION)

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 $VM_USER@$VM_HOST ECR_TOKEN="$ECR_TOKEN" ECR_REGISTRY="$ECR_REGISTRY" ECR_FRONTEND_REPO="$ECR_FRONTEND_REPO" ECR_BACKEND_REPO="$ECR_BACKEND_REPO" 'bash -s' << 'EOF'
            set -e
            cd ~/app

            echo "$ECR_TOKEN" | docker login --username AWS --password-stdin $ECR_REGISTRY

            cat << 'ENVEOF' > .env
            ECR_REGISTRY=${ECR_REGISTRY}
            ECR_FRONTEND_REPO=${ECR_FRONTEND_REPO}
            ECR_BACKEND_REPO=${ECR_BACKEND_REPO}
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME || 'prod_db' }}
            DB_USER=${{ secrets.DB_USER || 'postgres' }}
            DB_PASSWORD='${{ secrets.DB_PASSWORD || 'postgres' }}'
            SECRET_KEY='${{ secrets.SECRET_KEY || 'prod-secret-key-123' }}'
            DEBUG=False
            ALLOWED_HOSTS=*
            ENVEOF

            docker compose -f docker-compose-prod.yaml pull
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans
            docker image prune -f
          EOF